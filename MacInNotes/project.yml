name: MacInNotes
options:
  bundleIdPrefix: com.macinnotes
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacInNotes:
    type: application
    platform: macOS
    sources:
      - MacInNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macinnotes.app
        INFOPLIST_FILE: MacInNotes/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacInNotes/Resources/MacInNotes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: MacInNotes/Resources/Info.plist

  MacInNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MacInNotesTests
    dependencies:
      - target: MacInNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macinnotes.tests
