name: NotesPlus
options:
  bundleIdPrefix: com.notesplus
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NotesPlus:
    type: application
    platform: macOS
    sources:
      - NotesPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notesplus.app
        INFOPLIST_FILE: NotesPlus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotesPlus/Resources/NotesPlus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: NotesPlus/Resources/Info.plist

  NotesPlusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NotesPlusTests
    dependencies:
      - target: NotesPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notesplus.tests
